<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMC 每日复习</title>
<style>
:root {
  --bg: #f2f3f5;
  --card: #ffffff;
  --ink: #1f2328;
  --muted: #667085;
  --line: #d9dde3;
  --green: #1f8a4c;
  --green-bg: #e7f6ee;
  --red: #c0382b;
  --red-bg: #fdeceb;
  --amber: #a35f08;
  --amber-bg: #fdf3e2;
  --accent: #2f6f6f;
  --accent-bg: #e8f1f1;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 96px; }
header.top {
  position: sticky; top: 0; z-index: 20;
  background: rgba(242,243,245,.96);
  border-bottom: 1px solid var(--line);
  padding: 10px 0;
  backdrop-filter: blur(6px);
}
.top-inner { max-width: 980px; margin: 0 auto; padding: 0 16px; }
.top-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
h1 { font-size: 19px; margin: 0; letter-spacing: 0; }
.date-nav { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.date-nav button {
  background: #fff; border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
}
.date-nav button:hover { border-color: var(--accent); }
.date-nav select {
  background: #fff; border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 10px; font: inherit; font-size: 13px; color: var(--ink);
}
.stats { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.progress { height: 8px; background: #e7e9ec; border-radius: 4px; overflow: hidden; margin-top: 8px; max-width: 420px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--green); transition: width .2s; }
.day-summary {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px 16px; margin: 18px 0; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline;
}
.day-summary .date-big { font-size: 17px; font-weight: 700; }
.day-summary .muted { color: var(--muted); font-size: 13px; }
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 8px; padding: 36px; text-align: center; color: var(--muted); }
.note-block { margin: 18px 0; }
.note-title { font-size: 14px; font-weight: 700; color: var(--accent); margin: 0 0 10px; }
.section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.section-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.section-title { font-size: 14px; font-weight: 600; }
.tag { font-size: 11.5px; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.tag.done { background: var(--green-bg); color: var(--green); }
.tag.inherit { background: var(--amber-bg); color: var(--amber); }
.qcard { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.qcard:first-child { border-top: none; margin-top: 0; padding-top: 0; }
.qtop { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.qtop.hidden-before { display: none; }
.qcard.answered .qtop.hidden-before { display: flex; }
.qid { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-bg); padding: 2px 8px; border-radius: 6px; }
.qsection { font-size: 12px; color: var(--muted); }
.stem { font-size: 14.5px; white-space: pre-wrap; margin: 0 0 10px; }
.opts { display: grid; gap: 8px; }
.opt {
  display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left;
  background: #fff; border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 12px; font: inherit; color: var(--ink); cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-bg); }
.opt:disabled { cursor: default; }
.opt .letter { font-weight: 700; color: var(--muted); min-width: 18px; }
.opt .pct { margin-left: auto; font-size: 12px; color: var(--muted); display: none; }
.opt.choosen-right { border-color: var(--green); background: var(--green-bg); }
.opt.choosen-right .letter, .opt.choosen-right .pct { color: var(--green); }
.opt.choosen-wrong { border-color: var(--red); background: var(--red-bg); }
.opt.choosen-wrong .letter, .opt.choosen-wrong .pct { color: var(--red); }
.opt.reveal-right { border-color: var(--green); background: var(--green-bg); }
.opt.reveal-right .letter { color: var(--green); }
.opt.show-pct .pct { display: inline; }
.feedback { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.feedback .verdict { font-weight: 700; font-size: 14px; }
.verdict.right { color: var(--green); }
.verdict.wrong { color: var(--red); }
.feedback .block { margin: 10px 0 0; font-size: 13.5px; white-space: pre-wrap; }
.feedback .label { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
.feedback .hint-block { color: var(--amber); background: var(--amber-bg); border-left: 3px solid var(--amber); padding: 6px 10px; border-radius: 0 6px 6px 0; }
.feedback .block.learning { color: #d97706; }
.feedback .block.learning .label { color: #d97706; }
.day-actions { margin-left: auto; display: flex; gap: 8px; }
.sched-panel { margin-top: 12px; }
.sched-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.sched-options button {
  background: #fff; border: 1px solid var(--line); border-radius: 7px;
  padding: 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--ink);
}
.sched-options button:hover { border-color: var(--accent); }
.sched-options button:disabled { cursor: default; opacity: .7; }
.sync-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; width: 100%; }
.sync-row input {
  flex: 0 1 220px; background: #fff; border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 10px; font: inherit; font-size: 13px; color: var(--ink);
}
.sync-status { font-size: 12px; color: var(--muted); }
.footerbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: rgba(255,255,255,.97); border-top: 1px solid var(--line);
  padding: 10px 16px; display: flex; gap: 14px; align-items: center;
  backdrop-filter: blur(6px);
}
.footer-meta { font-size: 13px; color: var(--muted); }
.footer-meta b { color: var(--ink); }
button.flat {
  background: #fff; border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px;
  font: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
}
button.flat:hover { border-color: var(--accent); }
img.sec-img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; display: block; }
@media (max-width: 640px) {
  .date-nav { margin-left: 0; width: 100%; }
  h1 { font-size: 17px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <h1>AMC 每日复习</h1>
      <div class="date-nav">
        <button id="btn-prev" aria-label="前一天">‹ 前一天</button>
        <select id="date-select" aria-label="选择日期"></select>
        <button id="btn-next" aria-label="后一天">后一天 ›</button>
      </div>
    </div>
    <div class="stats">
      <span>日期 <b id="stat-date">-</b></span>
      <span>章节 <b id="stat-sections">0</b></span>
      <span>题目 <b id="stat-questions">0</b></span>
      <span>已答 <b id="stat-answered">0</b></span>
      <span>正确 <b id="stat-correct">0</b></span>
      <span>正确率 <b id="stat-rate">-</b></span>
    </div>
    <div class="progress"><i id="progress-bar"></i></div>
  </div>
</header>
<div class="wrap">
  <div class="day-summary">
    <span class="date-big" id="summary-date">-</span>
    <span class="muted" id="summary-text">-</span>
    <div class="day-actions">
      <button class="flat" id="btn-due">到期复习</button>
      <button class="flat" id="btn-reset">重置当日作答</button>
    </div>
    <div class="sync-row">
      <input id="sync-code" type="password" placeholder="同步码" autocomplete="off">
      <button class="flat" id="btn-sync">同步</button>
      <span class="sync-status" id="sync-status"></span>
    </div>
  </div>
  <main id="main"></main>
</div>
<div class="footerbar">
  <div class="footer-meta"><span id="footer-meta">0 / 0 正确</span></div>
</div>
<script>
"use strict";
let DATA = null;
let currentDate = "";
let view = "daily";
let dueAnswers = {};

const LS_PREFIX = "amc-review-platform-";
const IS_GITHUB_PAGES = location.hostname.endsWith("github.io");
const SYNC_API = IS_GITHUB_PAGES
  ? "https://amc-review.netlify.app/.netlify/functions/progress"
  : "/.netlify/functions/progress";
const $ = id => document.getElementById(id);

async function init() {
  const res = await fetch("data.json", {cache: "no-store"});
  DATA = await res.json();
  currentDate = DATA.defaultDate || firstDate();
  fillDateSelect();
  $("btn-prev").addEventListener("click", () => moveDate(-1));
  $("btn-next").addEventListener("click", () => moveDate(1));
  $("date-select").addEventListener("change", e => { currentDate = e.target.value; render(); });
  $("btn-reset").addEventListener("click", () => {
    if (!confirm("清除当前日期的作答记录？")) return;
    localStorage.removeItem(LS_PREFIX + currentDate);
    render();
  });
  $("btn-due").addEventListener("click", () => {
    view = view === "due" ? "daily" : "due";
    dueAnswers = {};
    render();
  });
  const codeInput = $("sync-code");
  codeInput.value = syncCode;
  $("btn-sync").addEventListener("click", () => {
    syncCode = codeInput.value.trim();
    localStorage.setItem(SYNC_CODE_KEY, syncCode);
    schedulePull();
  });
  render();
  if (syncCode) schedulePull();
}

function dates() {
  return Object.keys(DATA.days).sort().reverse();
}
function firstDate() {
  const d = dates();
  return d.length ? d[0] : "";
}
function fillDateSelect() {
  const sel = $("date-select");
  sel.innerHTML = "";
  for (const d of dates()) {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = d;
    sel.appendChild(opt);
  }
  sel.value = currentDate;
}
function moveDate(delta) {
  const list = dates();
  const i = list.indexOf(currentDate);
  if (i === -1) return;
  const j = Math.min(Math.max(i + delta, 0), list.length - 1);
  if (j !== i) {
    currentDate = list[j];
    $("date-select").value = currentDate;
    render();
  }
}

function answersFor(date) {
  try {
    return JSON.parse(localStorage.getItem(LS_PREFIX + date) || "{}") || {};
  } catch (e) {
    return {};
  }
}
function saveAnswers(date, answers) {
  localStorage.setItem(LS_PREFIX + date, JSON.stringify(answers));
}

function scheduleMap() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_PREFIX + "schedule") || "{}") || {};
    const out = {};
    for (const qid of Object.keys(raw)) {
      const entry = raw[qid];
      out[qid] = typeof entry === "string" ? {due: entry, updatedAt: ""} : entry;
    }
    return out;
  } catch (e) {
    return {};
  }
}
function saveScheduleMap(map) {
  localStorage.setItem(LS_PREFIX + "schedule", JSON.stringify(map));
}
function setSchedule(qid, due) {
  const map = scheduleMap();
  map[qid] = due ? {due, updatedAt: new Date().toISOString()} : {deleted: true, updatedAt: new Date().toISOString()};
  saveScheduleMap(map);
  updateDueBadge();
  schedulePush();
}
function dueQids() {
  if (!DATA) return [];
  const today = todayStr();
  const map = scheduleMap();
  return Object.keys(map)
    .filter(qid => DATA.questions[qid] && !map[qid].deleted && map[qid].due <= today)
    .sort((a, b) => (map[a].due < map[b].due ? -1 : map[a].due > map[b].due ? 1 : 0));
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const SYNC_CODE_KEY = LS_PREFIX + "sync-code";
let syncCode = localStorage.getItem(SYNC_CODE_KEY) || "";
let syncTimer = null;

function syncStatus(text) {
  const el = $("sync-status");
  if (el) el.textContent = text;
}
function schedulePush() {
  if (!syncCode) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      const res = await fetch(SYNC_API, {
        method: "PUT",
        headers: {"content-type": "application/json"},
        body: JSON.stringify({code: syncCode, data: scheduleMap()})
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      syncStatus("已同步 " + new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}));
    } catch (e) {
      syncStatus("同步失败");
    }
  }, 600);
}
async function schedulePull() {
  if (!syncCode) return;
  syncStatus("同步中...");
  try {
    const res = await fetch(SYNC_API + "?code=" + encodeURIComponent(syncCode), {cache: "no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const remote = await res.json();
    const local = scheduleMap();
    const merged = Object.assign({}, remote);
    for (const qid of Object.keys(local)) {
      const l = local[qid];
      const r = remote[qid];
      if (!r || (l.updatedAt || "") > (r.updatedAt || "")) merged[qid] = l;
    }
    saveScheduleMap(merged);
    syncStatus("已同步");
    updateDueBadge();
    if (view === "due") render();
  } catch (e) {
    syncStatus("同步失败");
  }
}
function updateDueBadge() {
  const n = dueQids().length;
  $("btn-due").textContent = view === "due" ? "返回每日" : "到期复习 (" + n + ")";
}
function allContext() {
  const map = {};
  for (const date of Object.keys(DATA.days)) {
    for (const note of DATA.days[date].notes) {
      for (const sec of note.sections) {
        for (const qid of sec.qids) {
          if (!map[qid]) map[qid] = {note: note.title, section: sec.title, hint: sec.hints[qid] || ""};
        }
      }
    }
  }
  return map;
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function render() {
  const day = DATA.days[currentDate];
  $("stat-date").textContent = currentDate || "-";
  $("summary-date").textContent = currentDate || "-";
  $("btn-reset").style.display = view === "due" ? "none" : "";
  updateDueBadge();
  if (view === "due") {
    renderDue();
    return;
  }
  const main = $("main");
  main.innerHTML = "";
  if (!day || !day.notes.length) {
    main.innerHTML = '<div class="empty">该日期没有勾选的标题。请在 Obsidian 中勾选标题并运行每日生成脚本。</div>';
    updateStats(0, []);
    return;
  }
  $("summary-text").textContent =
    "共 " + day.stats.sections + " 个章节、" + day.stats.questions + " 道题";

  const qids = [];
  const seen = new Set();
  const qContext = {};
  const fragments = [];
  for (const note of day.notes) {
    const block = document.createElement("div");
    block.className = "note-block";
    const noteTitle = document.createElement("h2");
    noteTitle.className = "note-title";
    noteTitle.textContent = note.title;
    block.appendChild(noteTitle);
    for (const sec of note.sections) {
      const secEl = document.createElement("section");
      secEl.className = "section";
      const head = document.createElement("div");
      head.className = "section-head";
      const title = document.createElement("span");
      title.className = "section-title";
      title.textContent = ("· ".repeat(sec.level - 2)) + sec.title;
      const tag = document.createElement("span");
      tag.className = "tag " + (sec.inherited ? "inherit" : "done");
      tag.textContent = sec.inherited ? "由上级继承 · " + sec.date : "已勾选 · " + sec.date;
      head.append(title, tag);
      secEl.appendChild(head);
      if (sec.images.length) {
        const img = document.createElement("img");
        img.className = "sec-img";
        img.src = sec.images[0];
        img.alt = sec.title;
        secEl.appendChild(img);
      }
      for (const qid of sec.qids) {
        if (!DATA.questions[qid]) continue;
        if (!seen.has(qid)) {
          seen.add(qid);
          qids.push(qid);
          qContext[qid] = {note: note.title, section: sec.title, hint: sec.hints[qid] || ""};
        }
        secEl.appendChild(questionCard(qid, sec, qContext[qid]));
      }
      block.appendChild(secEl);
    }
    main.appendChild(block);
  }
  const answers = answersFor(currentDate);
  for (const qid of qids) {
    if (answers[qid] !== undefined) answer(qid, answers[qid], true);
  }
  updateStats(qids.length, qids);
}

function renderDue() {
  const main = $("main");
  main.innerHTML = "";
  const qids = dueQids();
  $("summary-date").textContent = todayStr();
  if (!qids.length) {
    $("summary-text").textContent = "当前没有到期复习题";
    main.innerHTML = '<div class="empty">暂无到期复习题。做题后可选择“最新一天”或“3天后”安排再次出现。</div>';
    updateStats(0, []);
    return;
  }
  $("summary-text").textContent = "共 " + qids.length + " 道到期复习题";
  const ctx = allContext();
  const block = document.createElement("div");
  block.className = "note-block";
  const title = document.createElement("h2");
  title.className = "note-title";
  title.textContent = "到期复习";
  block.appendChild(title);
  for (const qid of qids) {
    block.appendChild(questionCard(qid, {}, ctx[qid] || {note: "", section: qid, hint: ""}));
  }
  main.appendChild(block);
  updateStats(qids.length, qids);
}

function questionCard(qid, sec, ctx) {
  const q = DATA.questions[qid];
  const card = document.createElement("div");
  card.className = "qcard";
  card.dataset.qid = qid;
  const top = document.createElement("div");
  top.className = "qtop hidden-before";
  const qidEl = document.createElement("span");
  qidEl.className = "qid";
  qidEl.textContent = qid;
  const secEl = document.createElement("span");
  secEl.className = "qsection";
  secEl.textContent = ctx.section;
  top.append(qidEl, secEl);
  card.appendChild(top);
  const stem = document.createElement("p");
  stem.className = "stem";
  stem.textContent = q.stem;
  card.appendChild(stem);
  const opts = document.createElement("div");
  opts.className = "opts";
  const letters = "ABCDEFGHIJ";
  q.options.forEach((o, oi) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt";
    btn.dataset.idx = oi;
    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = letters[oi] || "?";
    const txt = document.createElement("span");
    txt.textContent = o.text;
    const pct = document.createElement("span");
    pct.className = "pct";
    pct.textContent = o.pct + "% 答对";
    btn.append(letter, txt, pct);
    btn.addEventListener("click", () => answer(qid, oi, false));
    opts.appendChild(btn);
  });
  card.appendChild(opts);
  const fb = document.createElement("div");
  fb.className = "feedback";
  fb.style.display = "none";
  card.appendChild(fb);
  return card;
}

function answer(qid, idx, restore) {
  const card = document.querySelector('.qcard[data-qid="' + CSS.escape(qid) + '"]');
  if (!card || card.classList.contains("answered")) return;
  const q = DATA.questions[qid];
  const buttons = [...card.querySelectorAll(".opt")];
  const right = q.correctIndex;
  const isRight = idx === right;
  buttons.forEach((b, i) => {
    b.disabled = true;
    b.classList.add("show-pct");
    if (i === right) b.classList.add("reveal-right");
    if (i === idx && !isRight) b.classList.add("choosen-wrong");
    if (i === idx && isRight) b.classList.add("choosen-right");
  });
  card.classList.add("answered");
  const fb = card.querySelector(".feedback");
  const verdict = document.createElement("div");
  verdict.className = "verdict " + (isRight ? "right" : "wrong");
  verdict.textContent = (isRight ? "回答正确" : "回答错误") + " · 正确答案：" + q.correctAnswer;
  fb.innerHTML = "";
  fb.appendChild(verdict);
  const ctx = qContextOf(qid);
  if (ctx && ctx.hint) {
    const block = document.createElement("div");
    block.className = "block hint-block";
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "题眼";
    block.append(label, document.createTextNode(ctx.hint));
    fb.appendChild(block);
  }
  if (q.rationale) {
    const block = document.createElement("div");
    block.className = "block";
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "解释";
    block.append(label, document.createTextNode(q.rationale));
    fb.appendChild(block);
  }
  if (q.learning) {
    const block = document.createElement("div");
    block.className = "block learning";
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "Learning Points";
    block.append(label, document.createTextNode(q.learning));
    fb.appendChild(block);
  }
  fb.style.display = "block";
  if (view === "due") {
    dueAnswers[qid] = idx;
  } else {
    const answers = answersFor(currentDate);
    answers[qid] = idx;
    saveAnswers(currentDate, answers);
  }
  if (!restore) {
    addSchedulePanel(fb, qid);
    const qids = view === "due" ? dueQids() : orderedQids();
    updateStats(qids.length, qids);
  }
}

function addSchedulePanel(fb, qid) {
  const panel = document.createElement("div");
  panel.className = "block sched-panel";
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "后续安排";
  panel.appendChild(label);
  const options = document.createElement("div");
  options.className = "sched-options";
  const choices = [
    ["不保留", null],
    ["最新一天", dates()[0] || todayStr()],
    ["3天后", addDays(todayStr(), 3)]
  ];
  for (const [text, due] of choices) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = text;
    btn.addEventListener("click", () => {
      setSchedule(qid, due);
      btn.disabled = true;
      btn.textContent = text + " 已选";
      if (view === "due" && (!due || due > todayStr())) setTimeout(render, 350);
    });
    options.appendChild(btn);
  }
  panel.appendChild(options);
  fb.appendChild(panel);
}

function qContextOf(qid) {
  if (view === "due") return allContext()[qid] || null;
  const day = DATA.days[currentDate];
  if (!day) return null;
  for (const note of day.notes) {
    for (const sec of note.sections) {
      if (sec.qids.includes(qid)) {
        return {note: note.title, section: sec.title, hint: sec.hints[qid] || ""};
      }
    }
  }
  return null;
}

function orderedQids() {
  const day = DATA.days[currentDate];
  if (!day) return [];
  const out = [];
  const seen = new Set();
  for (const note of day.notes) {
    for (const sec of note.sections) {
      for (const qid of sec.qids) {
        if (!seen.has(qid) && DATA.questions[qid]) {
          seen.add(qid);
          out.push(qid);
        }
      }
    }
  }
  return out;
}

function updateStats(total, qids) {
  $("stat-sections").textContent = view === "due" ? 0 : (DATA.days[currentDate] ? DATA.days[currentDate].stats.sections : 0);
  $("stat-questions").textContent = total;
  const answers = view === "due" ? dueAnswers : answersFor(currentDate);
  const answered = qids.filter(qid => answers[qid] !== undefined);
  const correct = answered.filter(qid => answers[qid] === DATA.questions[qid].correctIndex);
  $("stat-answered").textContent = answered.length;
  $("stat-correct").textContent = correct.length;
  $("stat-rate").textContent = answered.length ? Math.round(correct.length / answered.length * 100) + "%" : "-";
  $("footer-meta").innerHTML = "<b>" + correct.length + "</b> / " + total + " 正确";
  $("progress-bar").style.width = (total ? answered.length / total * 100 : 0) + "%";
}

init();
</script>
</body>
</html>
